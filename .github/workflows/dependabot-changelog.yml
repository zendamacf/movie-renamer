name: Dependabot Changelog

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: read

jobs:
  dependabot-changelog:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Fetch Dependabot metadata
        id: dependabot_metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add towncrier fragment for Dependabot
        id: dependabot_fragment
        run: |
          FRAGMENT="changes/${{ github.event.pull_request.number }}.misc.md"
          if [ -f "$FRAGMENT" ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CONTENT="Bump ${{ steps.dependabot_metadata.outputs.dependency-names }} from ${{ steps.dependabot_metadata.outputs.previous-version }} to ${{ steps.dependabot_metadata.outputs.new-version }}."
          .venv/bin/towncrier create "${{ github.event.pull_request.number }}.misc.md" --content "$CONTENT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FRAGMENT"
          git commit -m "chore: add towncrier fragment for dependabot [dependabot skip]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push Dependabot towncrier fragment
        if: steps.dependabot_fragment.outputs.committed == 'true'
        run: git push
