[project]
name = "movie-renamer"
version = "0.0.1"
description = "Scan release-style movie folders and organise into Plex/Jellyfin-friendly layout."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Zach", email = "zach@example.com" }]
dependencies = [
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.0.0",
  "ty>=0.0.70",
  "pytest>=9.1.1",
]

[project.scripts]
movie-renamer = "movie_renamer.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.ty]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# Keep diagnostics non-fatal to match the previous `mypy` (non-strict) setup.
all = "warn"

[tool.ty.terminal]
# Exit with code 0 if everything is just warnings.
error-on-warning = false

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_empty = true
